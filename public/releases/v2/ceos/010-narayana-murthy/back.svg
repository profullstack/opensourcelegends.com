<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>N. R. Narayana Murthy — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">TECH CEOS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">N. R. Narayana Murthy</tspan></text><rect x="48" y="228" width="904" height="5" fill="#fa9ad5"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Founded Infosys in 1981 with six colleagues and seed money</tspan><tspan x="48" y="377.6">borrowed from his wife, and built it into the company that</tspan><tspan x="48" y="411.2">made offshore software delivery a credible global business</tspan><tspan x="48" y="444.79999999999995">rather than a cost-cutting rumour. Infosys became the first</tspan><tspan x="48" y="478.4">India-registered company listed on Nasdaq, in 1999.</tspan><tspan x="48" y="512">Domestically he was as known for insisting on</tspan><tspan x="48" y="545.5999999999999">Western-standard disclosure and governance at a time when</tspan><tspan x="48" y="579.1999999999999">neither was expected of an Indian firm.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">IT services · Offshore delivery · Corporate governance</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">010 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>