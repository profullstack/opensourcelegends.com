<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Reed Hastings — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">TECH CEOS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Reed Hastings</tspan></text><rect x="48" y="228" width="904" height="5" fill="#fa9ad5"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Co-founded Netflix as a DVD-by-post service in 1997,</tspan><tspan x="48" y="377.6">launched streaming in 2007 against his own profitable</tspan><tspan x="48" y="411.2">business, then commissioned originals against the studios</tspan><tspan x="48" y="444.79999999999995">he licensed from. Netflix engineering shaped how the</tspan><tspan x="48" y="478.4">industry runs services at scale and published most of it:</tspan><tspan x="48" y="512">Chaos Monkey, Hystrix, Eureka and Zuul all shipped as open</tspan><tspan x="48" y="545.5999999999999">source, and chaos engineering came out of that work.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Streaming · Distributed systems · Culture</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">3 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">021 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>