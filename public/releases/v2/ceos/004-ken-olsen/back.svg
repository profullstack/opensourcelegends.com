<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Ken Olsen — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">TECH CEOS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Ken Olsen</tspan></text><rect x="48" y="228" width="904" height="5" fill="#fa9ad5"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Founded DEC in 1957 and built computers people could put</tspan><tspan x="48" y="377.6">their hands on, at a time when a computer meant a room you</tspan><tspan x="48" y="411.2">booked time in. The PDP-7 and PDP-11 are where Unix and C</tspan><tspan x="48" y="444.79999999999995">were written; the VAX and VMS ran a generation of</tspan><tspan x="48" y="478.4">university and research computing. He also spent the 1980s</tspan><tspan x="48" y="512">dismissing the personal computer, and DEC was sold to</tspan><tspan x="48" y="545.5999999999999">Compaq six years after he left.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Minicomputers · PDP · VAX</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">004 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>