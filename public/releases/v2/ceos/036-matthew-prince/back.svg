<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Matthew Prince — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">TECH CEOS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Matthew Prince</tspan></text><rect x="48" y="228" width="904" height="5" fill="#fa9ad5"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Co-founded Cloudflare in 2009 with Michelle Zatlyn and Lee</tspan><tspan x="48" y="377.6">Holloway and gave away DDoS protection and a CDN to anyone</tspan><tspan x="48" y="411.2">who asked, which is why a large share of the web now passes</tspan><tspan x="48" y="444.79999999999995">through it. The company open-sourced Quiche, Pingora and</tspan><tspan x="48" y="478.4">the Workers runtime, funded Let’s Encrypt, and runs Project</tspan><tspan x="48" y="512">Galileo for civil society sites at no charge.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">CDN · Security · Edge computing</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">3 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">036 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>