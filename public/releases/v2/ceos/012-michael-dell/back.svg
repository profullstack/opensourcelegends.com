<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Michael Dell — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">TECH CEOS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Michael Dell</tspan></text><rect x="48" y="228" width="904" height="5" fill="#fa9ad5"/><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Started assembling PCs in a University of Texas dorm room</tspan><tspan x="48" y="377.6">in 1984 and turned direct sales and negative working</tspan><tspan x="48" y="411.2">capital into a manufacturing weapon: the customer paid</tspan><tspan x="48" y="444.79999999999995">before the supplier did. He took the company private in a</tspan><tspan x="48" y="478.4">$24.4 billion buyout in 2013, then bought EMC, and with it</tspan><tspan x="48" y="512">VMware, for about $67 billion in 2016.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">PCs · Supply chain · Enterprise hardware</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#fa9ad5" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">012 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>