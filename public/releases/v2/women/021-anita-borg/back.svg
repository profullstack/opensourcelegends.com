<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Anita Borg — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">WOMEN IN TECH / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Anita Borg</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ffc66c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">An OS researcher who built a fault-tolerant Unix and a</tspan><tspan x="48" y="377.6">memory architecture analysis tool, and who in 1987 started</tspan><tspan x="48" y="411.2">Systers, the first email network for women in computing.</tspan><tspan x="48" y="444.79999999999995">Co-founded the Grace Hopper Celebration and the Institute</tspan><tspan x="48" y="478.4">for Women and Technology. The conference now draws tens of</tspan><tspan x="48" y="512">thousands a year.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Operating systems · Community building · Advocacy</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">021 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>