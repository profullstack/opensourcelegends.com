<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Karen Sandler — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">WOMEN IN TECH / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Karen Sandler</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ffc66c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Executive director of the Software Freedom Conservancy,</tspan><tspan x="48" y="377.6">which provides the legal and financial home for a long list</tspan><tspan x="48" y="411.2">of open source projects and does the unglamorous work of</tspan><tspan x="48" y="444.79999999999995">GPL enforcement. A lawyer with a heart condition, she has</tspan><tspan x="48" y="478.4">made the argument for auditable code concrete by asking to</tspan><tspan x="48" y="512">see the source of the defibrillator implanted in her chest,</tspan><tspan x="48" y="545.5999999999999">and being refused.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Software freedom · Licensing enforcement · Nonprofit governance</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">029 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>