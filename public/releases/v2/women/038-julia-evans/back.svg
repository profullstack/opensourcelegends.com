<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Julia Evans — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">WOMEN IN TECH / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Julia Evans</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ffc66c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Writes hand-drawn zines and a long-running blog that</tspan><tspan x="48" y="377.6">explain strace, tcpdump, DNS, containers, git internals and</tspan><tspan x="48" y="411.2">networking better than the manuals do, mostly by working</tspan><tspan x="48" y="444.79999999999995">through her own confusion in public. Wrote a Ruby profiler</tspan><tspan x="48" y="478.4">and various debugging tools. An enormous number of</tspan><tspan x="48" y="512">engineers learned how their machine works from her</tspan><tspan x="48" y="545.5999999999999">drawings.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Systems programming · Debugging · Technical writing</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">038 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>