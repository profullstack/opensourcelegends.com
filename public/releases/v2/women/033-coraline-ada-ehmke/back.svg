<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Coraline Ada Ehmke — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">WOMEN IN TECH / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Coraline Ada Ehmke</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ffc66c"/><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Wrote the Contributor Covenant in 2014; it has since been</tspan><tspan x="48" y="377.6">adopted by well over a hundred thousand projects including</tspan><tspan x="48" y="411.2">Linux, Rails and Kubernetes, and it is the reason most</tspan><tspan x="48" y="444.79999999999995">repositories have a CODE_OF_CONDUCT.md at all. Also created</tspan><tspan x="48" y="478.4">the Hippocratic License and the Organization for Ethical</tspan><tspan x="48" y="512">Source, and took a great deal of abuse for both.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Community governance · Codes of conduct · Ethical licensing</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ffc66c" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">033 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>