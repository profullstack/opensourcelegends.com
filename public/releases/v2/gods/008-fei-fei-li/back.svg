<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Fei-Fei Li — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">GODS OF AI / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Fei-Fei Li</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ad9cff"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Built ImageNet when the field believed better algorithms</tspan><tspan x="48" y="377.6">mattered more than more data, and gave it away. The 2012</tspan><tspan x="48" y="411.2">competition on that dataset is the moment deep learning</tspan><tspan x="48" y="444.79999999999995">stopped being a minority position. Founded Stanford HAI,</tspan><tspan x="48" y="478.4">served as chief scientist of AI at Google Cloud, and has</tspan><tspan x="48" y="512">pushed hard on who gets a say in how this technology is</tspan><tspan x="48" y="545.5999999999999">built.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Computer vision · Datasets · Human-centred AI</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">008 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>