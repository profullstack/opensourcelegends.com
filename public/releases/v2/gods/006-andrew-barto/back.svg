<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Andrew Barto — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">GODS OF AI / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Andrew Barto</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ad9cff"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">With Sutton, built reinforcement learning into a coherent</tspan><tspan x="48" y="377.6">field from the actor-critic architecture onward, and</tspan><tspan x="48" y="411.2">co-wrote the textbook that defined it. His work tied</tspan><tspan x="48" y="444.79999999999995">machine learning back to animal learning and</tspan><tspan x="48" y="478.4">dopamine-driven reward prediction, which turned out to</tspan><tspan x="48" y="512">describe both. Shared the 2024 Turing Award.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Reinforcement learning · Control · Neuroscience-inspired AI</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">006 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>