<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Jan Leike — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">GODS OF AI / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Jan Leike</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ad9cff"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Co-led the work that turned RLHF into InstructGPT and then</tspan><tspan x="48" y="377.6">ChatGPT, and headed OpenAI’s superalignment effort.</tspan><tspan x="48" y="411.2">Resigned publicly in 2024 saying safety culture had lost</tspan><tspan x="48" y="444.79999999999995">out to shipping, which is a rare thing for someone at that</tspan><tspan x="48" y="478.4">level to say on the record, and moved to Anthropic to</tspan><tspan x="48" y="512">continue the work.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Alignment · RLHF · Scalable oversight</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">048 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>