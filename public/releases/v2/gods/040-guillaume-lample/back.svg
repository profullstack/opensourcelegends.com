<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Guillaume Lample — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">GODS OF AI / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Guillaume Lample</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ad9cff"/><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Led LLaMA at Meta, showing that a smaller model trained on</tspan><tspan x="48" y="377.6">far more tokens beat much larger ones — and then it reached</tspan><tspan x="48" y="411.2">the public. Nearly every open fine-tune, quantisation and</tspan><tspan x="48" y="444.79999999999995">local-inference project of the following two years traces</tspan><tspan x="48" y="478.4">to those weights. Co-founded Mistral, which has kept</tspan><tspan x="48" y="512">releasing open-weight models under permissive licences.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Language models · Open weights · Efficient training</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ad9cff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">040 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>