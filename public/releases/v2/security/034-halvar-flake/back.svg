<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Thomas Dullien — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">SECURITY PROFESSIONALS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Thomas Dullien</tspan></text><rect x="48" y="228" width="904" height="5" fill="#69caff"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Built the graph-based binary diffing that made it routine</tspan><tspan x="48" y="377.6">to extract the vulnerability out of a vendor patch, founded</tspan><tspan x="48" y="411.2">zynamics around BinDiff and VxClass, and sold it to Google</tspan><tspan x="48" y="444.79999999999995">in 2011. Later worked in Project Zero and wrote the “weird</tspan><tspan x="48" y="478.4">machines” framing that treats exploitation as programming</tspan><tspan x="48" y="512">an unintended state machine inside the target.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Reverse engineering · Patch analysis · Exploit theory</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">034 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>