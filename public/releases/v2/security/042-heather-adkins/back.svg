<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Heather Adkins — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">SECURITY PROFESSIONALS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Heather Adkins</tspan></text><rect x="48" y="228" width="904" height="5" fill="#69caff"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">A founding member of Google’s security team who built and</tspan><tspan x="48" y="377.6">ran its incident response function, including the response</tspan><tspan x="48" y="411.2">to the 2009 Operation Aurora intrusion that Google chose to</tspan><tspan x="48" y="444.79999999999995">disclose publicly — a decision that reset industry norms on</tspan><tspan x="48" y="478.4">breach transparency. Co-authored Building Secure and</tspan><tspan x="48" y="512">Reliable Systems, and has served on US federal</tspan><tspan x="48" y="545.5999999999999">cybersecurity advisory bodies.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Incident response · Enterprise defence · Reliability</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">042 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>