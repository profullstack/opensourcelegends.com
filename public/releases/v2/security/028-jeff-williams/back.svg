<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Jeff Williams — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">SECURITY PROFESSIONALS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Jeff Williams</tspan></text><rect x="48" y="228" width="904" height="5" fill="#69caff"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Wrote the first OWASP Top Ten and served as the volunteer</tspan><tspan x="48" y="377.6">chair of OWASP from 2003 to 2011, the years in which it</tspan><tspan x="48" y="411.2">went from a mailing list to the reference that PCI DSS and</tspan><tspan x="48" y="444.79999999999995">a long line of other standards cite by name. Co-founded</tspan><tspan x="48" y="478.4">Aspect Security and then Contrast Security, arguing for</tspan><tspan x="48" y="512">instrumentation inside the running application rather than</tspan><tspan x="48" y="545.5999999999999">scanning it from outside.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Application security · Runtime protection · Standards</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">028 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>