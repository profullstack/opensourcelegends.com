<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Niels Provos — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">SECURITY PROFESSIONALS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Niels Provos</tspan></text><rect x="48" y="228" width="904" height="5" fill="#69caff"/><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Wrote honeyd, co-designed the bcrypt password hash with</tspan><tspan x="48" y="377.6">David Mazières, and created systrace and privilege</tspan><tspan x="48" y="411.2">separation work in OpenSSH. At Google he led the Safe</tspan><tspan x="48" y="444.79999999999995">Browsing malware research that put interstitial warnings in</tspan><tspan x="48" y="478.4">front of drive-by download sites, and co-authored the</tspan><tspan x="48" y="512">papers that measured how large that problem actually was.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Honeypots · Password hashing · Web malware</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#69caff" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">024 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>