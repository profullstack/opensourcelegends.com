<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>David Heinemeier Hansson — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">OPEN SOURCE LEGENDS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">David Heinemeier Hansson</tspan></text><rect x="48" y="228" width="904" height="5" fill="#64efb4"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">David Heinemeier Hansson transforms web development with</tspan><tspan x="48" y="377.6">Ruby on Rails, emphasizing simplicity and productivity. As</tspan><tspan x="48" y="411.2">a co-founder of Basecamp, he champions remote work and</tspan><tspan x="48" y="444.79999999999995">efficient project management.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Ruby on Rails · Basecamp · HEXO</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">1 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">010 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>