<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Richard Stallman — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">OPEN SOURCE LEGENDS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Richard Stallman</tspan></text><rect x="48" y="228" width="904" height="5" fill="#64efb4"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Richard Stallman is a pivotal figure in the free software</tspan><tspan x="48" y="377.6">movement. He advocates for user freedoms in software usage,</tspan><tspan x="48" y="411.2">study, and modification. His initiatives have shaped the</tspan><tspan x="48" y="444.79999999999995">landscape of software distribution and rights.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">GNU Project · Free Software Foundation · GNU C Compiler · GNU Emacs</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: unconfirmed. Sources and metadata accompany this</tspan><tspan x="48" y="1336.6">card in cards.json.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">001 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>