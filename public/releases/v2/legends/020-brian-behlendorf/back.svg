<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Brian Behlendorf — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">OPEN SOURCE LEGENDS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Brian Behlendorf</tspan></text><rect x="48" y="228" width="904" height="5" fill="#64efb4"/><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Brian Behlendorf is a pivotal figure in open source, known</tspan><tspan x="48" y="377.6">for co-founding the Apache Software Foundation. His</tspan><tspan x="48" y="411.2">leadership in developing the Apache HTTP Server has</tspan><tspan x="48" y="444.79999999999995">significantly shaped the web landscape, promoting</tspan><tspan x="48" y="478.4">collaboration and innovation in software development.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Apache HTTP Server · Apache Software Foundation · Mod_ssl</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">1 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#64efb4" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">020 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>