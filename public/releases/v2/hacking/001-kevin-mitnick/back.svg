<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Kevin Mitnick — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">HACKING LEGENDS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Kevin Mitnick</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ff9369"/><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Talked his way into more networks than he ever broke into.</tspan><tspan x="48" y="377.6">A teenage phone phreak who became the FBI’s most-wanted</tspan><tspan x="48" y="411.2">hacker, was captured in 1995, served five years, and came</tspan><tspan x="48" y="444.79999999999995">out the other side as a security consultant and author of</tspan><tspan x="48" y="478.4">The Art of Deception. He made the industry admit the</tspan><tspan x="48" y="512">obvious: the person on the phone is the vulnerability.</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Social engineering · Phone phreaking · Telecom</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">001 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>