<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1490" width="1000" height="1490"><title>Robert Tappan Morris — Open Source Legends v2</title><rect width="1000" height="1490" rx="26" fill="#10141c"/><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="64">HACKING LEGENDS / V2</tspan></text><text fill="#ffffff" font-size="38" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="145">Robert Tappan Morris</tspan></text><rect x="48" y="228" width="904" height="5" fill="#ff9369"/><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="292">THE CONTRIBUTION</tspan></text><text fill="#d8dde5" font-size="24" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="344">Released a self-replicating program from MIT in November</tspan><tspan x="48" y="377.6">1988 that reinfected hosts far faster than intended and</tspan><tspan x="48" y="411.2">knocked out a large share of the machines on the internet.</tspan><tspan x="48" y="444.79999999999995">First person convicted under the Computer Fraud and Abuse</tspan><tspan x="48" y="478.4">Act. Went on to become an MIT professor and a co-founder of</tspan><tspan x="48" y="512">Y Combinator.</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1005">PROJECTS / DOMAINS</tspan></text><text fill="#d8dde5" font-size="21" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1050">Worms · Unix internals</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1270">PROVENANCE</tspan></text><text fill="#d8dde5" font-size="19" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1310">2 references. NicheDB: not-found. Sources and metadata accompany this card</tspan><tspan x="48" y="1336.6">in cards.json.</tspan></text><text fill="#ff9369" font-size="18" font-family="DejaVu Sans,Arial,sans-serif"><tspan x="48" y="1442">003 / EDITION 2 / ARTWORK IS AN ORIGINAL INTERPRETATION</tspan></text></svg>